name: Android CI – LogKit

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build & Test LogKit
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the code
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Set up JDK 17 (matches Gradle/JitPack)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3. Cache Gradle and wrapper
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 4. Make Gradle wrapper executable
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 5. Build the LogKit library (release AAR)
      - name: Build LogKit release
        run: ./gradlew :LogKit:assembleRelease